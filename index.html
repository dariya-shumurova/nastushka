<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1 id="heading">
            Hey! You got a secret<br>
            message. Want to open it?
        </h1>

        <div class="envelope" id="envelope">
            <div class="back"></div>
            <div class="letter">
                <p>
                    ты моя самая любимаяя девочка
                    и самая красивая ...
                    емм я не знаю чо сказать я стесняюсь
                    я тебя люблю /////
                </p>
            </div>
            <div class="front"></div>
            <div class="flap"></div>
            <div class="heart">♥</div>
        </div>

        <div class="buttons" id="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>

        <p id="message"></p>

        <div id="hearts"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
